[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.30"
evm_version = "osaka"
optimizer = true
optimizer_runs = 200
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@zk-kit/imt.sol/=lib/zk-kit.solidity/packages/imt/contracts/",
  "poseidon-solidity/=lib/poseidon-solidity/contracts/",
]
